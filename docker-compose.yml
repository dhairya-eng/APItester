services:
  redis:
    image: redis:latest
    container_name: redis

  api1:
    build: .
    container_name: api1
    depends_on:
      - redis
  api2:
    build: .
    container_name: api2
    depends_on:
      - redis
  api3:
    build: .
    container_name: api3
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3