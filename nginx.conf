events {}

http {
    # Rate limiting: define a zone that tracks requests per client IP,
    # allowing 20 requests/sec per IP with a small burst allowance.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream api_servers {
        # max_fails=2: if a backend fails 2 requests in a row...
        # fail_timeout=10s: ...Nginx stops sending it traffic for 10s,
        # then cautiously tries it again. This is a PASSIVE health check —
        # free open-source Nginx doesn't do active polling health checks,
        # it only reacts after seeing real failures. That's a meaningful
        # limitation worth knowing (paid Nginx Plus / HAProxy / cloud LBs
        # do active checks — we'll touch HAProxy as a comparison later).
        server api1:8000 max_fails=2 fail_timeout=10s;
        server api2:8000 max_fails=2 fail_timeout=10s;
        server api3:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # If a backend is slow/unreachable, fail fast and let Nginx
            # try the next one instead of hanging.
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_500;
        }
    }
}